<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Hand-framing blur — dua tangan bentuk L jadi viewfinder, area dalam kotak di-blur real-time">
<title>Frame Blur Booth</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --accent: #ff3366; --bg: #0a0a0f; --panel: #161620; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: #fff;
    font-family: -apple-system, system-ui, sans-serif;
    height: 100dvh; display: flex; flex-direction: column; align-items: center;
    overflow: hidden;
  }
  #err {
    display: none; width: 100%; max-width: 640px; padding: 10px 14px;
    background: #3a1018; color: #ff8899; font-size: 13px; text-align: center;
  }
  #banner {
    display: none; width: 100%; padding: 10px 14px;
    background: #3a1a00; color: #ffcc88; font-size: 13px; text-align: center;
  }
  #stage {
    position: relative; width: 100%; max-width: 640px;
    aspect-ratio: 3/4; max-height: 64dvh; background: #111;
  }
  @media (min-width: 700px) {
    #stage { aspect-ratio: 4/3; max-height: none; }
  }
  #video, #canvas {
    width: 100%; height: 100%; object-fit: cover;
    position: absolute; inset: 0;
  }
  #video { transform: scaleX(-1); background: #000; }
  #canvas { transform: scaleX(-1); pointer-events: none; }
  #hud {
    position: absolute; top: 8px; left: 8px; right: 8px;
    display: flex; justify-content: space-between; z-index: 10;
    pointer-events: none; font-size: 12px; gap: 8px;
  }
  #hud span {
    background: var(--panel); padding: 6px 12px; border-radius: 20px;
    font-weight: 600;
  }
  #hud span.locked { background: var(--accent); }
  #hint {
    text-align: center; padding: 10px 16px; max-width: 520px;
    font-size: 13px; color: #999; line-height: 1.6;
  }
  #hint b { color: var(--accent); }
  #controls { display: flex; gap: 8px; padding: 10px; justify-content: center; }
  #controls button {
    background: var(--panel); border: 1px solid #333;
    color: #fff; padding: 12px 22px; border-radius: 12px;
    font-size: 14px; font-weight: 600; min-height: 44px;
    -webkit-tap-highlight-color: transparent;
  }
  #controls button.primary { background: var(--accent); border-color: var(--accent); }
  #controls button:disabled { opacity: .5; }
</style>
</head>
<body>
<div id="banner"></div>
<div id="err"></div>
<div id="stage">
  <video id="video" playsinline webkit-playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>
  <div id="hud">
    <span id="g-status">kamera off</span>
    <span id="g-frame">—</span>
  </div>
</div>
<div id="hint">
  Bikin <b>L</b> dengan dua tangan (jempol + telunjuk), satukan jadi kotak → area dalam kotak <b>auto blur</b> real-time. Jari lain ditekuk.
</div>
<div id="controls">
  <button class="primary" id="btn-start">Start Camera</button>
</div>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("g-status");
const frameEl = document.getElementById("g-frame");
const btnStart = document.getElementById("btn-start");
const banner = document.getElementById("banner");
const errBox = document.getElementById("err");

let landmarker = null;
let stream = null;
let running = false;
let rafId = 0;
let lastVideoTime = -1;
let locked = false;
let validStreak = 0;
let invalidStreak = 0;
let quad = null; // 4 titik {x,y} normalized, urut sudut

const blurCanvas = document.createElement("canvas");
const bctx = blurCanvas.getContext("2d");

const inApp = /FBAN|FBAV|Instagram|Line\/|WhatsApp|Telegram|wv\)/i.test(navigator.userAgent)
  || !!window.TelegramWebviewProxy
  || !!window.TelegramWebview;
if (inApp) {
  banner.style.display = "block";
  banner.textContent = "Buka di Chrome/Safari. Kamera diblokir in-app Telegram.";
}

function showErr(m) {
  errBox.style.display = "block";
  errBox.textContent = m;
  console.error(m);
}

// --- vectors & angles (landmark normalized) ---
function vec(a, b) { return { x: b.x - a.x, y: b.y - a.y }; }
function angleDeg(v1, v2) {
  const dot = v1.x * v2.x + v1.y * v2.y;
  const m = Math.hypot(v1.x, v1.y) * Math.hypot(v2.x, v2.y);
  if (!m) return 180;
  return Math.acos(Math.max(-1, Math.min(1, dot / m))) * 180 / Math.PI;
}
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

// Valid L: thumb(4→2) ⊥ index(8→5) ±35°, index terbuka, 3 jari lain folded
function isLShape(lm) {
  const a = angleDeg(vec(lm[2], lm[4]), vec(lm[5], lm[8]));
  if (Math.abs(a - 90) > 35) return false;
  if (lm[8].y >= lm[6].y) return false;                 // index tip di atas pip
  if (lm[12].y <= lm[10].y) return false;               // middle folded
  if (lm[16].y <= lm[14].y) return false;               // ring folded
  if (lm[20].y <= lm[18].y) return false;               // pinky folded
  return true;
}

// 4 corner: thumb+index tip dari 2 tangan, sort-by-angle dari centroid → anti bowtie
function buildQuad(hA, hB) {
  const pts = [hA[4], hA[8], hB[4], hB[8]].map(p => ({ x: p.x, y: p.y }));
  const cx = pts.reduce((s, p) => s + p.x, 0) / 4;
  const cy = pts.reduce((s, p) => s + p.y, 0) / 4;
  return pts.sort((p, q) =>
    Math.atan2(p.y - cy, p.x - cx) - Math.atan2(q.y - cy, q.x - cx));
}

// --- render ---
function loop() {
  if (!running) return;
  rafId = requestAnimationFrame(loop);
  if (!landmarker || video.readyState < 2) return;
  if (video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;

  if (canvas.width !== video.videoWidth) {
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    blurCanvas.width = canvas.width;
    blurCanvas.height = canvas.height;
  }
  const w = canvas.width, h = canvas.height;

  const result = landmarker.detectForVideo(video, performance.now());
  const hands = result.landmarks || [];

  // 1-2. dua tangan valid L + range jarak
  let frameHands = null;
  if (hands.length >= 2) {
    const candidates = hands.filter(isLShape);
    if (candidates.length >= 2) {
      const cA = candidates[0], cB = candidates[1];
      const c1 = cA[0], c2 = cB[0];
      const d = dist(c1, c2);
      if (d > 0.12 && d < 0.7) frameHands = [cA, cB];
    }
  }

  // stabilisasi: lock setelah 8 frame valid, unlock setelah 8 invalid
  if (frameHands) { validStreak++; invalidStreak = 0; }
  else { invalidStreak++; validStreak = 0; }
  if (!locked && validStreak >= 8) locked = true;
  if (locked && invalidStreak >= 8) { locked = false; quad = null; }
  if (frameHands) quad = buildQuad(frameHands[0], frameHands[1]);

  // 5-8. composite: frame asli + area quad di-blur via mask polygon
  ctx.clearRect(0, 0, w, h);
  ctx.drawImage(video, 0, 0, w, h);

  if (quad && locked) {
    // draw landmark titik corner sebagai feedback
    ctx.fillStyle = "rgba(255,255,255,.9)";
    for (const p of quad) {
      ctx.beginPath();
      ctx.arc(p.x * w, p.y * h, 5, 0, Math.PI * 2);
      ctx.fill();
    }
    // blur full-frame ke offscreen, mask polygon, composite
    bctx.clearRect(0, 0, w, h);
    bctx.filter = "blur(12px)";
    bctx.drawImage(video, 0, 0, w, h);
    bctx.filter = "none";
    bctx.save();
    bctx.beginPath();
    bctx.moveTo(quad[0].x * w, quad[0].y * h);
    for (let i = 1; i < 4; i++) bctx.lineTo(quad[i].x * w, quad[i].y * h);
    bctx.closePath();
    bctx.globalCompositeOperation = "destination-in";
    bctx.fillStyle = "#fff";
    bctx.fill();
    bctx.restore();
    ctx.drawImage(blurCanvas, 0, 0, w, h);

    // outline kotak
    ctx.strokeStyle = "#ff3366";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(quad[0].x * w, quad[0].y * h);
    for (let i = 1; i < 4; i++) ctx.lineTo(quad[i].x * w, quad[i].y * h);
    ctx.closePath();
    ctx.stroke();
    frameEl.textContent = "🔒 LOCK";
    frameEl.classList.add("locked");
  } else {
    ctx.strokeStyle = "rgba(255,255,255,.3)";
    ctx.lineWidth = 2;
    if (quad) {
      ctx.beginPath();
      ctx.moveTo(quad[0].x * w, quad[0].y * h);
      for (let i = 1; i < 4; i++) ctx.lineTo(quad[i].x * w, quad[i].y * h);
      ctx.closePath();
      ctx.stroke();
    }
    frameEl.textContent = hands.length ? "bentuk L di 2 tangan" : "tunjuk 2 tangan";
    frameEl.classList.remove("locked");
  }
}

// --- model + camera ---
async function loadModel() {
  if (landmarker) return;
  statusEl.textContent = "load model…";
  const fileset = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  landmarker = await HandLandmarker.createFromOptions(fileset, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numHands: 2,
    minHandDetectionConfidence: 0.5,
    minHandPresenceConfidence: 0.5,
    minTrackingConfidence: 0.5
  });
}

async function start() {
  errBox.style.display = "none";
  if (!navigator.mediaDevices?.getUserMedia) {
    showErr("Browser tidak support kamera. Pakai Chrome/Safari.");
    return;
  }
  btnStart.disabled = true;
  try {
    await loadModel();
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }
    });
    video.srcObject = stream;
    video.setAttribute("playsinline", "");
    video.setAttribute("webkit-playsinline", "");
    await video.play();
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    blurCanvas.width = canvas.width;
    blurCanvas.height = canvas.height;
    running = true;
    lastVideoTime = -1;
    loop();
    btnStart.textContent = "Stop";
    btnStart.classList.remove("primary");
    statusEl.textContent = "● LIVE";
    statusEl.style.color = "#00ff88";
  } catch (e) {
    const n = e.name || "";
    if (n === "NotAllowedError") showErr("Izin kamera ditolak. Settings → kamera ON.");
    else if (n === "NotFoundError") showErr("Kamera tidak ketemu.");
    else if (n === "NotReadableError") showErr("Kamera dipakai app lain. Tutup dulu.");
    else showErr("Gagal: " + (e.message || n || e));
    stop();
  } finally {
    btnStart.disabled = false;
  }
}

function stop() {
  running = false;
  cancelAnimationFrame(rafId);
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.srcObject = null;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  btnStart.textContent = "Start Camera";
  btnStart.classList.add("primary");
  statusEl.textContent = "kamera off";
  statusEl.style.color = "#fff";
  frameEl.textContent = "—";
  frameEl.classList.remove("locked");
  quad = null; locked = false;
}

btnStart.onclick = () => running ? stop() : start();
</script>
</body>
</html>
