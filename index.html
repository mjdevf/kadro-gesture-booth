<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Hand-framing blur — dua tangan bentuk L jadi viewfinder, area dalam kotak di-blur real-time">
<title>Frame Blur Booth</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --accent: #ff3366; --bg: #0a0a0f; --panel: #161620; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: #fff;
    font-family: -apple-system, system-ui, sans-serif;
    height: 100dvh; display: flex; flex-direction: column; align-items: center;
    overflow: hidden;
  }
  #banner, #err {
    display: none; width: 100%; max-width: 640px; padding: 10px 14px;
    font-size: 13px; text-align: center;
  }
  #banner { background: #3a1a00; color: #ffcc88; }
  #err { background: #3a1018; color: #ff8899; }
  #stage {
    position: relative; width: 100%; max-width: 640px;
    aspect-ratio: 3/4; max-height: 64dvh; background: #111;
  }
  @media (min-width: 700px) {
    #stage { aspect-ratio: 4/3; max-height: none; }
  }
  #video, #canvas {
    width: 100%; height: 100%; object-fit: cover;
    position: absolute; inset: 0;
  }
  #video { transform: scaleX(-1); background: #000; }
  #canvas { transform: scaleX(-1); pointer-events: none; }
  #hud {
    position: absolute; top: 8px; left: 8px; right: 8px;
    display: flex; justify-content: space-between; z-index: 10;
    pointer-events: none; font-size: 12px; gap: 8px;
  }
  #hud span {
    background: var(--panel); padding: 6px 12px; border-radius: 20px;
    font-weight: 600; white-space: nowrap;
  }
  #hud span.locked { background: var(--accent); }
  #debug {
    display: none; width: 100%; max-width: 640px; padding: 8px 14px;
    font-size: 11px; color: #7f8; font-family: ui-monospace, monospace;
    line-height: 1.5;
  }
  #hint {
    text-align: center; padding: 10px 16px; max-width: 520px;
    font-size: 13px; color: #999; line-height: 1.6;
  }
  #hint b { color: var(--accent); }
  #controls { display: flex; gap: 8px; padding: 10px; justify-content: center; flex-wrap: wrap; }
  #controls button {
    background: var(--panel); border: 1px solid #333;
    color: #fff; padding: 12px 22px; border-radius: 12px;
    font-size: 14px; font-weight: 600; min-height: 44px;
    -webkit-tap-highlight-color: transparent;
  }
  #controls button.primary { background: var(--accent); border-color: var(--accent); }
  #controls button:disabled { opacity: .5; }
</style>
</head>
<body>
<div id="banner"></div>
<div id="err"></div>
<div id="stage">
  <video id="video" playsinline webkit-playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>
  <div id="hud">
    <span id="g-status">kamera off</span>
    <span id="g-frame">—</span>
  </div>
</div>
<div id="hint">
  Bikin <b>L</b> dua tangan (jempol + telunjuk siku-siku, jari lain tekuk), satukan → kotak muncul, area dalam kotak <b>auto blur</b>.
</div>
<div id="controls">
  <button class="primary" id="btn-start">Start Camera</button>
  <button id="btn-debug">Debug</button>
</div>
<div id="debug"></div>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("g-status");
const frameEl = document.getElementById("g-frame");
const btnStart = document.getElementById("btn-start");
const btnDebug = document.getElementById("btn-debug");
const banner = document.getElementById("banner");
const errBox = document.getElementById("err");
const debugBox = document.getElementById("debug");

let landmarker = null;
let stream = null;
let running = false;
let rafId = 0;
let lastVideoTime = -1;
let locked = false;
let validStreak = 0, invalidStreak = 0;
let quad = null;
let dbg = { hands: 0, valid: 0, err: "", fps: 0, frames: 0, t0: performance.now() };

const blurCanvas = document.createElement("canvas");
const bctx = blurCanvas.getContext("2d");

const inApp = /FBAN|FBAV|Instagram|Line\/|WhatsApp|Telegram|wv\)/i.test(navigator.userAgent)
  || !!window.TelegramWebviewProxy || !!window.TelegramWebview;
if (inApp) {
  banner.style.display = "block";
  banner.textContent = "Buka di Chrome/Safari. Kamera diblokir in-app Telegram.";
}

function showErr(m) {
  errBox.style.display = "block";
  errBox.textContent = m;
  console.error(m);
}
function setStatus(t) {
  statusEl.textContent = t;
  console.log("[status]", t);
}

// --- helper ---
function vec(a, b) { return { x: b.x - a.x, y: b.y - a.y }; }
function angleDeg(v1, v2) {
  const dot = v1.x * v2.x + v1.y * v2.y;
  const m = Math.hypot(v1.x, v1.y) * Math.hypot(v2.x, v2.y);
  if (!m) return 999;
  return Math.acos(Math.max(-1, Math.min(1, dot / m))) * 180 / Math.PI;
}
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

// orientation-invariant: bandingkan jarak tip vs pip dari wrist
// extended: tip > pip jaraknya dari wrist; folded: tip < pip
function fingerState(lm, tipId, pipId) {
  const w = lm[0];
  const dTip = dist(w, lm[tipId]);
  const dPip = dist(w, lm[pipId]);
  return dTip > dPip ? 1 : 0; // 1 = extended
}

// L valid: thumb(2→4) ⊥ index(5→8) ±45°, index extended, middle/ring/pinky folded
function isLShape(lm) {
  const a = angleDeg(vec(lm[2], lm[4]), vec(lm[5], lm[8]));
  if (Math.abs(a - 90) > 45) return false;
  if (!fingerState(lm, 8, 6)) return false;    // index extended
  if (fingerState(lm, 12, 10)) return false;   // middle folded
  if (fingerState(lm, 16, 14)) return false;   // ring folded
  if (fingerState(lm, 20, 18)) return false;   // pinky folded
  return true;
}

function buildQuad(hA, hB) {
  const pts = [hA[4], hA[8], hB[4], hB[8]].map(p => ({ x: p.x, y: p.y }));
  const cx = pts.reduce((s, p) => s + p.x, 0) / 4;
  const cy = pts.reduce((s, p) => s + p.y, 0) / 4;
  return pts.sort((p, q) =>
    Math.atan2(p.y - cy, p.x - cx) - Math.atan2(q.y - cy, q.x - cx));
}

// --- render ---
function loop() {
  if (!running) return;
  rafId = requestAnimationFrame(loop);

  const w = canvas.width, h = canvas.height;
  if (!landmarker || video.readyState < 2 || video.videoWidth === 0) return;
  if (video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;

  const result = landmarker.detectForVideo(video, performance.now());
  const hands = result.landmarks || [];
  dbg.hands = hands.length;

  let frameHands = null;
  const valid = hands.filter(isLShape);
  dbg.valid = valid.length;
  if (valid.length >= 2) {
    const cA = valid[0], cB = valid[1];
    const d = dist(cA[0], cB[0]);
    if (d > 0.08 && d < 0.85) frameHands = [cA, cB];
  }

  if (frameHands) { validStreak++; invalidStreak = 0; }
  else { invalidStreak++; validStreak = 0; }
  if (!locked && validStreak >= 6) locked = true;
  if (locked && invalidStreak >= 10) { locked = false; quad = null; }
  if (frameHands) quad = buildQuad(frameHands[0], frameHands[1]);

  ctx.clearRect(0, 0, w, h);
  ctx.drawImage(video, 0, 0, w, h);

  if (quad && locked) {
    bctx.clearRect(0, 0, w, h);
    bctx.filter = "blur(12px)";
    bctx.drawImage(video, 0, 0, w, h);
    bctx.filter = "none";
    bctx.save();
    bctx.beginPath();
    bctx.moveTo(quad[0].x * w, quad[0].y * h);
    for (let i = 1; i < 4; i++) bctx.lineTo(quad[i].x * w, quad[i].y * h);
    bctx.closePath();
    bctx.globalCompositeOperation = "destination-in";
    bctx.fillStyle = "#fff";
    bctx.fill();
    bctx.restore();
    ctx.drawImage(blurCanvas, 0, 0, w, h);
    ctx.strokeStyle = "#ff3366";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(quad[0].x * w, quad[0].y * h);
    for (let i = 1; i < 4; i++) ctx.lineTo(quad[i].x * w, quad[i].y * h);
    ctx.closePath();
    ctx.stroke();
    frameEl.textContent = "🔒 LOCK";
    frameEl.classList.add("locked");
  } else {
    if (quad) {
      ctx.strokeStyle = "rgba(255,255,255,.35)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(quad[0].x * w, quad[0].y * h);
      for (let i = 1; i < 4; i++) ctx.lineTo(quad[i].x * w, quad[i].y * h);
      ctx.closePath();
      ctx.stroke();
    }
    frameEl.textContent = hands.length >= 2
      ? (valid.length >= 2 ? "2 tangan valid — diam sebentar" : "L-nya belum pas")
      : `terlihat ${dbg.hands} tangan`;
    frameEl.classList.remove("locked");
  }

  // debug
  dbg.frames++;
  const dt = performance.now() - dbg.t0;
  if (dt > 500) {
    dbg.fps = Math.round(dbg.frames * 1000 / dt);
    dbg.frames = 0;
    dbg.t0 = performance.now();
    renderDebug();
  }
}

function renderDebug() {
  if (debugBox.style.display === "none") return;
  debugBox.textContent =
    `fps: ${dbg.fps} | hands: ${dbg.hands} | L-valid: ${dbg.valid} | locked: ${locked} | ` +
    `streak: ${validStreak}/${invalidStreak}${dbg.err ? " | err: " + dbg.err : ""}`;
}

// --- model + camera ---
async function loadModel() {
  if (landmarker) return true;
  setStatus("load wasm…");
  const fileset = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  setStatus("load model…");
  for (const delegate of ["GPU", "CPU"]) {
    try {
      landmarker = await HandLandmarker.createFromOptions(fileset, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          delegate
        },
        runningMode: "VIDEO",
        numHands: 2,
        minHandDetectionConfidence: 0.4,
        minHandPresenceConfidence: 0.4,
        minTrackingConfidence: 0.4
      });
      setStatus("model OK (" + delegate + ")");
      return true;
    } catch (e) {
      console.warn("delegate", delegate, "gagal:", e);
      dbg.err = "delegate " + delegate + " gagal, coba lain";
    }
  }
  return false;
}

async function start() {
  errBox.style.display = "none";
  if (!navigator.mediaDevices?.getUserMedia) {
    showErr("Browser tidak support kamera. Pakai Chrome/Safari.");
    return;
  }
  btnStart.disabled = true;
  btnDebug.style.display = "inline-block";
  try {
    const ok = await loadModel();
    if (!ok) { showErr("Model gagal load. Cek internet / coba Chrome terbaru."); return; }
    setStatus("minta kamera…");
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: "user" }
    });
    video.srcObject = stream;
    video.setAttribute("playsinline", "");
    video.setAttribute("webkit-playsinline", "");
    await video.play();
    const vw = video.videoWidth || 640, vh = video.videoHeight || 480;
    canvas.width = vw; canvas.height = vh;
    blurCanvas.width = vw; blurCanvas.height = vh;
    running = true;
    lastVideoTime = -1;
    loop();
    btnStart.textContent = "Stop";
    btnStart.classList.remove("primary");
    setStatus("● LIVE");
    statusEl.style.color = "#00ff88";
  } catch (e) {
    const n = e.name || "";
    if (n === "NotAllowedError") showErr("Izin kamera ditolak. Settings → kamera ON.");
    else if (n === "NotFoundError") showErr("Kamera tidak ketemu.");
    else if (n === "NotReadableError") showErr("Kamera dipakai app lain. Tutup dulu.");
    else showErr("Gagal: " + (e.message || n || e));
    console.error(e);
    stop();
  } finally {
    btnStart.disabled = false;
  }
}

function stop() {
  running = false;
  cancelAnimationFrame(rafId);
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.srcObject = null;
  if (canvas.width) ctx.clearRect(0, 0, canvas.width, canvas.height);
  btnStart.textContent = "Start Camera";
  btnStart.classList.add("primary");
  setStatus("kamera off");
  statusEl.style.color = "#fff";
  frameEl.textContent = "—";
  frameEl.classList.remove("locked");
  quad = null; locked = false;
}

btnStart.onclick = () => running ? stop() : start();
btnDebug.onclick = () => {
  debugBox.style.display = debugBox.style.display === "none" ? "block" : "none";
  renderDebug();
};
</script>
</body>
</html>
