<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Photo booth gesture — dua tangan L bikin kotak blur, peace buat foto">
<title>Kadro — Gesture Photo Booth</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --accent: #ff375f; --accent-soft: rgba(255,55,95,.14);
    --bg: #09090b; --bg-2: #0e0e11; --panel: #131316;
    --line: rgba(255,255,255,.09); --text: #f4f4f5; --muted: #8b8b93;
    --ok: #30d158; --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(1100px 480px at 50% -12%, var(--accent-soft), transparent 62%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "SF Pro Display", system-ui, sans-serif;
    height: 100dvh; display: flex; flex-direction: column; align-items: center;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #banner, #err {
    display: none; width: 100%; max-width: 640px; padding: 10px 14px;
    font-size: 13px; text-align: center;
  }
  #banner { background: #3a1a00; color: #ffcc88; }
  #err { background: #3a1018; color: #ff8899; }

  header {
    width: 100%; max-width: 640px; display: flex; align-items: center;
    justify-content: space-between; padding: 16px 22px 12px;
    position: relative;
  }
  header::after {
    content: ""; position: absolute; left: 22px; right: 22px; bottom: 0;
    height: 1px; background: var(--line);
  }
  .brand { display: flex; align-items: center; gap: 11px; font-weight: 800; font-size: 17px; letter-spacing: -.02em; }
  .brand .dot {
    width: 20px; height: 20px; border-radius: 6px;
    background: var(--accent);
    box-shadow: 0 0 0 1px rgba(255,255,255,.15) inset, 0 0 20px var(--accent-soft);
  }
  .brand small { display: block; font-size: 9px; font-weight: 600; color: var(--muted); letter-spacing: .14em; text-transform: uppercase; }
  .tagline { font-size: 11px; color: var(--muted); font-family: var(--mono); letter-spacing: .04em; }

  #stage {
    position: relative; width: calc(100% - 28px); max-width: 620px;
    aspect-ratio: 3/4; max-height: 56dvh; background: #0b0b0e;
    border-radius: 18px; overflow: hidden;
    border: 1px solid var(--line);
    box-shadow: 0 24px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.02) inset;
    animation: rise .5s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  @media (min-width: 700px) {
    #stage { aspect-ratio: 4/3; max-height: none; }
  }
  #video, #canvas {
    width: 100%; height: 100%; object-fit: cover;
    position: absolute; inset: 0;
  }
  #video { transform: scaleX(-1); background: #000; }
  #canvas { transform: scaleX(-1); pointer-events: none; }

  /* viewfinder corner brackets — camera aesthetic */
  #corners { position: absolute; inset: 10px; z-index: 9; pointer-events: none; }
  #corners i { position: absolute; width: 22px; height: 22px; border: 2px solid var(--accent); opacity: .55; }
  #corners i:nth-child(1) { top: 0; left: 0; border-right: 0; border-bottom: 0; border-radius: 6px 0 0 0; }
  #corners i:nth-child(2) { top: 0; right: 0; border-left: 0; border-bottom: 0; border-radius: 0 6px 0 0; }
  #corners i:nth-child(3) { bottom: 0; left: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 6px; }
  #corners i:nth-child(4) { bottom: 0; right: 0; border-left: 0; border-top: 0; border-radius: 0 0 6px 0; }

  #cover {
    position: absolute; inset: 0; z-index: 15;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; background: rgba(9,9,11,.78); backdrop-filter: blur(6px);
    text-align: center; padding: 24px;
  }
  #cover svg {
    filter: drop-shadow(0 10px 30px rgba(255,55,95,.3));
    animation: float 3.2s ease-in-out infinite;
  }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  #cover h2 { font-size: 19px; font-weight: 800; letter-spacing: -.01em; }
  #cover p { font-size: 13px; color: var(--muted); max-width: 280px; line-height: 1.55; }
  #cover p b { color: var(--text); font-weight: 700; }

  #hud {
    position: absolute; top: 12px; left: 12px; right: 12px;
    display: flex; justify-content: space-between; z-index: 10;
    pointer-events: none; font-size: 12px; gap: 8px;
  }
  #hud span {
    background: rgba(14,14,17,.72); backdrop-filter: blur(10px);
    padding: 6px 12px; border-radius: 999px; font-weight: 600;
    white-space: nowrap; border: 1px solid var(--line);
    letter-spacing: .01em;
  }
  #hud span.locked {
    background: var(--accent); border-color: var(--accent); color: #fff;
    box-shadow: 0 0 24px var(--accent-soft);
  }
  #hud #g-status.live::before {
    content: ""; display: inline-block; width: 7px; height: 7px;
    border-radius: 50%; background: var(--ok); margin-right: 7px;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  #flash {
    position: absolute; inset: 0; background: #fff;
    opacity: 0; pointer-events: none; z-index: 20;
    transition: opacity .1s;
  }

  #guide {
    display: flex; gap: 0; width: calc(100% - 28px); max-width: 620px;
    padding: 14px 2px 6px;
  }
  #guide .card {
    flex: 1; display: flex; align-items: flex-start; gap: 11px;
    padding: 2px 14px;
  }
  #guide .card:first-child { border-right: 1px solid var(--line); }
  #guide .card b { display: block; font-size: 13px; font-weight: 700; margin-bottom: 2px; }
  #guide .card span { font-size: 11px; color: var(--muted); line-height: 1.45; display: block; }

  #controls {
    display: flex; gap: 8px; padding: 10px 0 4px;
    width: calc(100% - 28px); max-width: 620px;
  }
  #controls button {
    background: transparent; border: 1px solid var(--line);
    color: var(--text); padding: 12px 16px; border-radius: 12px;
    font-size: 14px; font-weight: 600; min-height: 46px;
    transition: transform .1s, border-color .2s, background .2s, box-shadow .2s;
  }
  #controls button:active { transform: scale(.96); }
  #controls button:not(:disabled):hover { border-color: rgba(255,255,255,.28); background: rgba(255,255,255,.04); }
  #controls button.primary {
    background: var(--accent); border-color: var(--accent); color: #fff;
    box-shadow: 0 8px 30px var(--accent-soft);
    flex: 1;
  }
  #controls button.primary:not(:disabled):hover { background: #ff4d70; border-color: #ff4d70; }
  #controls button:disabled { opacity: .38; }

  #gallery {
    display: flex; gap: 8px; padding: 10px 14px 16px;
    overflow-x: auto; max-width: 100%; flex: 1; align-items: center;
    scrollbar-width: none;
  }
  #gallery::-webkit-scrollbar { display: none; }
  #gallery .thumb {
    position: relative; height: 62px; border-radius: 10px;
    border: 1px solid var(--line); flex-shrink: 0;
    animation: rise .35s cubic-bezier(.2,.8,.2,1);
  }
  #gallery .count {
    align-self: center; font-size: 11px; color: var(--muted);
    white-space: nowrap; font-family: var(--mono); letter-spacing: .03em;
    padding: 6px 10px; border: 1px dashed var(--line); border-radius: 999px;
    flex-shrink: 0;
  }

  #debug {
    display: none; width: 100%; max-width: 640px; padding: 8px 14px;
    font-size: 11px; color: #7f8; font-family: var(--mono);
    line-height: 1.5;
  }
</style>
</head>
<body>
<div id="banner"></div>
<div id="err"></div>

<header>
  <div class="brand">
    <div class="dot"></div>
    <div>Kadro<small>gesture photo booth</small></div>
  </div>
  <div class="tagline">kamera → gesture → <b style="color:var(--text)">foto</b></div>
</header>

<div id="stage">
  <video id="video" playsinline webkit-playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>
  <div id="corners"><i></i><i></i><i></i><i></i></div>
  <div id="cover">
    <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 8px 24px rgba(255,51,102,.35)); animation: float 3s ease-in-out infinite;">
      <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
      <circle cx="12" cy="13" r="3.5"/>
    </svg>
    <h2>Nyalain kamera, main pakai tangan</h2>
    <p>Dua tangan bikin <b style="color:var(--text)">L</b> → kotak + blur. Satu tangan <b style="color:var(--text)">peace</b> → foto.</p>
  </div>
  <div id="hud">
    <span id="g-status">kamera off</span>
    <span id="g-frame">—</span>
  </div>
  <div id="flash"></div>
</div>

<div id="guide">
  <div class="card">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 3H5a2 2 0 0 0-2 2v2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/>
      <path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M17 21h2a2 2 0 0 0 2-2v-2"/>
    </svg>
    <div><b>L dua tangan</b><span>jempol+telunjuk siku-siku, jari lain tekuk → blur</span></div>
  </div>
  <div class="card">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
      <circle cx="12" cy="13" r="3.5"/>
    </svg>
    <div><b>Peace</b><span>satu tangan, telunjuk+tengah naik → foto</span></div>
  </div>
</div>

<div id="controls">
  <button class="primary" id="btn-start">Nyalain Kamera</button>
  <button id="btn-capture" disabled>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:6px;"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3.5"/></svg>
    Foto
  </button>
  <button id="btn-download" disabled>Unduh</button>
  <button id="btn-effect" disabled>Efek: Blur</button>
  <button id="btn-debug">Debug</button>
</div>

<div id="gallery"><span class="count" id="g-count">0 foto</span></div>
<div id="debug"></div>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("g-status");
const frameEl = document.getElementById("g-frame");
const btnStart = document.getElementById("btn-start");
const btnCapture = document.getElementById("btn-capture");
const btnDownload = document.getElementById("btn-download");
const btnEffect = document.getElementById("btn-effect");
const btnDebug = document.getElementById("btn-debug");
const banner = document.getElementById("banner");
const errBox = document.getElementById("err");
const debugBox = document.getElementById("debug");

let landmarker = null;
let stream = null;
let running = false;
let rafId = 0;
let lastVideoTime = -1;
let locked = false;
let validStreak = 0, invalidStreak = 0;
let quad = null;
let rawQuad = null;
let prevRawQuad = null;
let photos = [];
let photoBusy = false;
let peaceStreak = 0;
let lGrace = 0; // frame setelah L aktif — peace diblokir
let effectMode = 0; // 0 blur, 1 invert, 2 grayscale, 3 pixelate, 4 off
const EFFECT_NAMES = ["Blur", "Negatif", "B&W", "Pixel", "Off"];
const EFFECT_FILTERS = ["blur(12px)", "invert(1)", "grayscale(1)", "none", "none"];
let lastFxQuad = null; // quad terakhir pas locked — buat reconstruct foto
let lastFxAt = 0;
let dbg = { hands: 0, valid: 0, score: [], peace: false, err: "", fps: 0, frames: 0, t0: performance.now() };

const blurCanvas = document.createElement("canvas");
const bctx = blurCanvas.getContext("2d");

const inApp = /FBAN|FBAV|Instagram|Line\/|WhatsApp|Telegram|wv\)/i.test(navigator.userAgent)
  || !!window.TelegramWebviewProxy || !!window.TelegramWebview;
if (inApp) {
  banner.style.display = "block";
  banner.textContent = "Buka di Chrome/Safari. Kamera diblokir in-app Telegram.";
}

function showErr(m) {
  errBox.style.display = "block";
  errBox.textContent = m;
  console.error(m);
}
function setStatus(t) {
  statusEl.textContent = t;
  console.log("[status]", t);
}

// --- helper ---
function vec(a, b) { return { x: b.x - a.x, y: b.y - a.y }; }
function angleDeg(v1, v2) {
  const dot = v1.x * v2.x + v1.y * v2.y;
  const m = Math.hypot(v1.x, v1.y) * Math.hypot(v2.x, v2.y);
  if (!m) return 999;
  return Math.acos(Math.max(-1, Math.min(1, dot / m))) * 180 / Math.PI;
}
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

// hybrid: extended kalau tip di atas pip ATAU jelas lebih jauh dari wrist (margin 1.25x)
// folded kalau dua-duanya setuju. Netral kalau konflik → ga dihitung.
function ext(lm, tip, pip) {
  const w = lm[0];
  return (lm[tip].y < lm[pip].y) ||
         (dist(w, lm[tip]) > dist(w, lm[pip]) * 1.25);
}
function folded(lm, tip, pip) {
  const w = lm[0];
  return (lm[tip].y > lm[pip].y) &&
         (dist(w, lm[tip]) < dist(w, lm[pip]) * 1.25);
}

// skor L 0..5: index extended, middle folded, ring folded, pinky folded, angle 90±50
function lScore(lm) {
  let s = 0;
  if (ext(lm, 8, 6)) s++;
  if (folded(lm, 12, 10)) s++;
  if (folded(lm, 16, 14)) s++;
  if (folded(lm, 20, 18)) s++;
  const a = angleDeg(vec(lm[3], lm[4]), vec(lm[6], lm[8]));
  if (Math.abs(a - 90) <= 50) s++;
  return s;
}

function buildQuad(hA, hB) {
  const pts = [hA[4], hA[8], hB[4], hB[8]].map(p => ({ x: p.x, y: p.y }));
  const cx = pts.reduce((s, p) => s + p.x, 0) / 4;
  const cy = pts.reduce((s, p) => s + p.y, 0) / 4;
  return pts.sort((p, q) =>
    Math.atan2(p.y - cy, p.x - cx) - Math.atan2(q.y - cy, q.x - cx));
}

// perbesar quad dari centroid + clamp ke frame, biar blur ga cuma nempel di wajah
function expandQuad(pts, f) {
  const cx = pts.reduce((s, p) => s + p.x, 0) / 4;
  const cy = pts.reduce((s, p) => s + p.y, 0) / 4;
  return pts.map(p => ({
    x: Math.max(0.02, Math.min(0.98, cx + (p.x - cx) * f)),
    y: Math.max(0.02, Math.min(0.98, cy + (p.y - cy) * f))
  }));
}

// lerp antar frame biar quad halus, ga lompat-lompat
function smoothQuad(cur, prev, t) {
  if (!prev) return cur;
  return cur.map((p, i) => ({
    x: prev[i].x + (p.x - prev[i].x) * t,
    y: prev[i].y + (p.y - prev[i].y) * t
  }));
}

// --- render ---
function loop() {
  if (!running) return;
  rafId = requestAnimationFrame(loop);

  const w = canvas.width, h = canvas.height;
  if (!landmarker || video.readyState < 2 || video.videoWidth === 0) return;
  if (video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;

  const result = landmarker.detectForVideo(video, performance.now());
  const hands = result.landmarks || [];
  dbg.hands = hands.length;

  let frameHands = null;
  const scored = hands
    .map(h => ({ lm: h, score: lScore(h) }))
    .sort((a, b) => b.score - a.score);
  dbg.valid = scored.length ? scored[0].score : 0;
  dbg.score = scored.map(s => s.score);
  const top = scored.filter(s => s.score >= 3).slice(0, 2);
  if (top.length === 2) {
    const d = dist(top[0].lm[0], top[1].lm[0]);
    if (d > 0.05 && d < 1.15) frameHands = [top[0].lm, top[1].lm];
  }

  // Peace: TEPAT 1 tangan, index+middle extended, ring+pinky folded, thumb bebas
  let peace = false;
  if (hands.length === 1) {
    const h = hands[0];
    peace = ext(h, 8, 6) && ext(h, 12, 10) && folded(h, 16, 14) && folded(h, 20, 18);
  }
  dbg.peace = peace;

  if (frameHands) { validStreak++; invalidStreak = 0; }
  else { invalidStreak++; validStreak = 0; }
  if (!locked && validStreak >= 6) locked = true;
  if (locked && invalidStreak >= 10) { locked = false; quad = null; rawQuad = null; prevRawQuad = null; }
  if (frameHands) {
    rawQuad = expandQuad(buildQuad(frameHands[0], frameHands[1]), 1.25);
    quad = smoothQuad(rawQuad, prevRawQuad, 0.5);
    prevRawQuad = rawQuad;
    lGrace = 24; // ada 2 L di frame → peace ga boleh nembak dulu
  } else if (lGrace > 0) {
    lGrace--;
  }

  // trigger foto: peace stabil 10 frame, ga ada L baru-baru ini, + cooldown
  if (peace && lGrace === 0) { peaceStreak++; }
  else { peaceStreak = 0; }
  if (peaceStreak === 10 && !photoBusy && !locked) captureNow();
  btnCapture.disabled = !running;
  btnDownload.disabled = photos.length === 0;
  btnEffect.disabled = !running;

  ctx.clearRect(0, 0, w, h);
  ctx.drawImage(video, 0, 0, w, h);

  if (quad && locked && effectMode !== 4) {
    lastFxQuad = quad.map(p => ({ x: p.x, y: p.y }));
    lastFxAt = performance.now();
    bctx.clearRect(0, 0, w, h);
    bctx.filter = EFFECT_FILTERS[effectMode];
    bctx.drawImage(video, 0, 0, w, h);
    bctx.filter = "none";

    // pixelate: downscale-upscale dalam mask
    if (effectMode === 3) {
      const bw = blurCanvas.width, bh = blurCanvas.height;
      bctx.clearRect(0, 0, bw, bh);
      bctx.imageSmoothingEnabled = false;
      const block = 12;
      bctx.drawImage(video, 0, 0, Math.max(1, bw / block), Math.max(1, bh / block));
      bctx.drawImage(blurCanvas, 0, 0, Math.max(1, bw / block), Math.max(1, bh / block), 0, 0, bw, bh);
      bctx.imageSmoothingEnabled = true;
    }

    bctx.save();
    bctx.beginPath();
    bctx.moveTo(quad[0].x * w, quad[0].y * h);
    for (let i = 1; i < 4; i++) bctx.lineTo(quad[i].x * w, quad[i].y * h);
    bctx.closePath();
    bctx.globalCompositeOperation = "destination-in";
    bctx.fillStyle = "#fff";
    bctx.fill();
    bctx.restore();
    ctx.drawImage(blurCanvas, 0, 0, w, h);
    ctx.strokeStyle = "#ff3366";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(quad[0].x * w, quad[0].y * h);
    for (let i = 1; i < 4; i++) ctx.lineTo(quad[i].x * w, quad[i].y * h);
    ctx.closePath();
    ctx.stroke();
    frameEl.textContent = "LOCK";
    frameEl.classList.add("locked");
  } else {
    if (quad) {
      ctx.strokeStyle = "rgba(255,255,255,.35)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(quad[0].x * w, quad[0].y * h);
      for (let i = 1; i < 4; i++) ctx.lineTo(quad[i].x * w, quad[i].y * h);
      ctx.closePath();
      ctx.stroke();
    }
    frameEl.textContent = peace
      ? (photoBusy ? "memotret…" : "peace — foto!")
      : hands.length >= 2
        ? "2 tangan L — diam sebentar"
        : `terlihat ${dbg.hands} tangan`;
    frameEl.classList.remove("locked");
  }

  // debug
  dbg.frames++;
  const dt = performance.now() - dbg.t0;
  if (dt > 500) {
    dbg.fps = Math.round(dbg.frames * 1000 / dt);
    dbg.frames = 0;
    dbg.t0 = performance.now();
    renderDebug();
  }
}

function renderDebug() {
  if (debugBox.style.display === "none") return;
  debugBox.textContent =
    `fps: ${dbg.fps} | hands: ${dbg.hands} | L: ${dbg.valid} (${(dbg.score || []).join("/")}) | ` +
    `peace: ${dbg.peace} | locked: ${locked} | streak: ${validStreak}/${invalidStreak}${dbg.err ? " | err: " + dbg.err : ""}`;
}

// --- foto ---
function captureNow() {
  if (photoBusy || !running) return;
  photoBusy = true;
  const flash = document.getElementById("flash");
  flash.style.opacity = "0.9";
  setTimeout(() => { flash.style.opacity = "0"; }, 150);

  // reconstruct: kalau efek L baru aja aktif (quad fresh < 2.5s lalu),
  // render ulang efek di quad itu ke frame sekarang → foto include box+efek
  const w = canvas.width, h = canvas.height;
  const fxQuad = (locked && quad) ? quad : (
    lastFxQuad && (performance.now() - lastFxAt) < 2500 ? lastFxQuad : null
  );
  const snap = document.createElement("canvas");
  snap.width = w; snap.height = h;
  const sctx = snap.getContext("2d");
  sctx.drawImage(video, 0, 0, w, h);
  if (fxQuad && effectMode !== 4) {
    const b = document.createElement("canvas");
    b.width = w; b.height = h;
    const b2 = b.getContext("2d");
    b2.filter = EFFECT_FILTERS[effectMode];
    b2.drawImage(video, 0, 0, w, h);
    b2.filter = "none";
    if (effectMode === 3) {
      b2.clearRect(0, 0, w, h);
      b2.imageSmoothingEnabled = false;
      const blk = 12;
      b2.drawImage(video, 0, 0, Math.max(1, w / blk), Math.max(1, h / blk));
      b2.drawImage(b, 0, 0, Math.max(1, w / blk), Math.max(1, h / blk), 0, 0, w, h);
      b2.imageSmoothingEnabled = true;
    }
    b2.save();
    b2.beginPath();
    b2.moveTo(fxQuad[0].x * w, fxQuad[0].y * h);
    for (let i = 1; i < 4; i++) b2.lineTo(fxQuad[i].x * w, fxQuad[i].y * h);
    b2.closePath();
    b2.globalCompositeOperation = "destination-in";
    b2.fillStyle = "#fff";
    b2.fill();
    b2.restore();
    sctx.drawImage(b, 0, 0, w, h);
    // outline tipis biar frame-nya keliatan framing
    sctx.strokeStyle = "rgba(255,55,95,.8)";
    sctx.lineWidth = 3;
    sctx.beginPath();
    sctx.moveTo(fxQuad[0].x * w, fxQuad[0].y * h);
    for (let i = 1; i < 4; i++) sctx.lineTo(fxQuad[i].x * w, fxQuad[i].y * h);
    sctx.closePath();
    sctx.stroke();
    lastFxQuad = null; // sekali pakai — foto berikutnya clean
  }
  const url = snap.toDataURL("image/jpeg", 0.92);
  photos.push(url);
  const cnt = document.getElementById("g-count");
  cnt.textContent = photos.length + " foto";
  const img = document.createElement("img");
  img.src = url;
  img.onclick = () => downloadPhoto(url);
  document.getElementById("gallery").appendChild(img);
  setTimeout(() => { photoBusy = false; }, 1200); // cooldown
}

function downloadPhoto(url) {
  const a = document.createElement("a");
  a.href = url;
  a.download = "booth-" + Date.now() + ".jpg";
  a.click();
}

// --- model + camera ---
async function loadModel() {
  if (landmarker) return true;
  setStatus("load wasm…");
  const fileset = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  setStatus("load model…");
  for (const delegate of ["GPU", "CPU"]) {
    try {
      landmarker = await HandLandmarker.createFromOptions(fileset, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          delegate
        },
        runningMode: "VIDEO",
        numHands: 2,
        minHandDetectionConfidence: 0.4,
        minHandPresenceConfidence: 0.4,
        minTrackingConfidence: 0.4
      });
      setStatus("model OK (" + delegate + ")");
      return true;
    } catch (e) {
      console.warn("delegate", delegate, "gagal:", e);
      dbg.err = "delegate " + delegate + " gagal, coba lain";
    }
  }
  return false;
}

async function start() {
  errBox.style.display = "none";
  if (!navigator.mediaDevices?.getUserMedia) {
    showErr("Browser tidak support kamera. Pakai Chrome/Safari.");
    return;
  }
  btnStart.disabled = true;
  btnDebug.style.display = "inline-block";
  try {
    const ok = await loadModel();
    if (!ok) { showErr("Model gagal load. Cek internet / coba Chrome terbaru."); return; }
    setStatus("minta kamera…");
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: "user" }
    });
    video.srcObject = stream;
    video.setAttribute("playsinline", "");
    video.setAttribute("webkit-playsinline", "");
    await video.play();
    const vw = video.videoWidth || 640, vh = video.videoHeight || 480;
    canvas.width = vw; canvas.height = vh;
    blurCanvas.width = vw; blurCanvas.height = vh;
    running = true;
    lastVideoTime = -1;
    loop();
    btnStart.textContent = "Matikan";
    btnStart.classList.remove("primary");
    setStatus("● LIVE");
    statusEl.style.color = "#fff";
    statusEl.classList.add("live");
    document.getElementById("cover").style.display = "none";
  } catch (e) {
    const n = e.name || "";
    if (n === "NotAllowedError") showErr("Izin kamera ditolak. Settings → kamera ON.");
    else if (n === "NotFoundError") showErr("Kamera tidak ketemu.");
    else if (n === "NotReadableError") showErr("Kamera dipakai app lain. Tutup dulu.");
    else showErr("Gagal: " + (e.message || n || e));
    console.error(e);
    stop();
  } finally {
    btnStart.disabled = false;
  }
}

function stop() {
  running = false;
  cancelAnimationFrame(rafId);
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.srcObject = null;
  if (canvas.width) ctx.clearRect(0, 0, canvas.width, canvas.height);
  btnStart.textContent = "Nyalain Kamera";
  btnStart.classList.add("primary");
  setStatus("kamera off");
  statusEl.style.color = "#fff";
  statusEl.classList.remove("live");
  frameEl.textContent = "—";
  frameEl.classList.remove("locked");
  quad = null; locked = false;
  rawQuad = null; prevRawQuad = null;
  document.getElementById("cover").style.display = "";
}

btnStart.onclick = () => running ? stop() : start();
btnCapture.onclick = captureNow;
btnEffect.onclick = () => {
  effectMode = (effectMode + 1) % EFFECT_NAMES.length;
  btnEffect.textContent = "Efek: " + EFFECT_NAMES[effectMode];
};
btnDownload.onclick = () => {
  if (!photos.length) return;
  photos.forEach((u, i) => setTimeout(() => downloadPhoto(u), i * 250));
};
btnDebug.onclick = () => {
  debugBox.style.display = debugBox.style.display === "none" ? "block" : "none";
  renderDebug();
};
</script>
