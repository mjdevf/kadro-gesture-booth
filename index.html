<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Photo booth gesture — peace capture, fist blur">
<title>Gesture Booth</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --accent: #ff3366; --bg: #0a0a0f; --panel: #161620; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: #fff;
    font-family: -apple-system, system-ui, sans-serif;
    height: 100dvh; display: flex; flex-direction: column; align-items: center;
    overflow: hidden;
  }
  #banner {
    display: none; width: 100%; padding: 10px 14px;
    background: #3a1a00; color: #ffcc88; font-size: 13px; text-align: center;
  }
  #err {
    display: none; width: 100%; max-width: 640px; padding: 10px 14px;
    background: #3a1018; color: #ff8899; font-size: 13px; text-align: center;
  }
  #stage {
    position: relative; width: 100%; max-width: 640px;
    aspect-ratio: 3/4; max-height: 58dvh; background: #111;
  }
  @media (min-width: 700px) {
    #stage { aspect-ratio: 4/3; max-height: none; }
  }
  #video, #canvas {
    width: 100%; height: 100%; object-fit: cover;
    position: absolute; inset: 0;
  }
  #video { transform: scaleX(-1); background: #000; }
  #canvas { transform: scaleX(-1); pointer-events: none; }
  #countdown {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;
    font-size: 7rem; font-weight: 900; color: var(--accent);
    text-shadow: 0 0 40px rgba(255,51,102,.6); z-index: 10;
  }
  #flash {
    position: absolute; inset: 0; background: #fff;
    opacity: 0; pointer-events: none; z-index: 20;
    transition: opacity .12s;
  }
  #hud {
    position: absolute; top: 8px; left: 8px; right: 8px;
    display: flex; justify-content: space-between; z-index: 10;
    pointer-events: none; font-size: 12px; gap: 8px;
  }
  #hud span {
    background: var(--panel); padding: 6px 12px; border-radius: 20px;
    font-weight: 600;
  }
  #hint {
    text-align: center; padding: 8px 12px 4px;
    font-size: 12px; color: #888; line-height: 1.5;
  }
  #hint b { color: var(--accent); }
  #controls {
    display: flex; gap: 8px; padding: 10px; justify-content: center;
    flex-wrap: wrap;
  }
  #controls button {
    background: var(--panel); border: 1px solid #333;
    color: #fff; padding: 12px 18px; border-radius: 12px;
    font-size: 14px; font-weight: 600; min-height: 44px;
    -webkit-tap-highlight-color: transparent;
  }
  #controls button.primary { background: var(--accent); border-color: var(--accent); }
  #controls button:disabled { opacity: .45; }
  #gallery {
    display: flex; gap: 6px; padding: 8px 8px 16px;
    overflow-x: auto; max-width: 100%; flex: 1;
  }
  #gallery img { height: 64px; border-radius: 8px; }
</style>
</head>
<body>
<div id="banner"></div>
<div id="err"></div>
<div id="stage">
  <video id="video" playsinline webkit-playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>
  <div id="flash"></div>
  <div id="countdown">3</div>
  <div id="hud">
    <span id="gesture-label">kamera off</span>
    <span id="status">●</span>
  </div>
</div>
<div id="hint">
  <b>✌️ Peace</b> capture &nbsp; <b>✊ Fist</b> blur &nbsp; <b>✋ Palm</b> filter
</div>
<div id="controls">
  <button class="primary" id="btn-start">Start Camera</button>
  <button id="btn-capture">Capture</button>
  <button id="btn-blur">Blur</button>
  <button id="btn-filter">Filter: Off</button>
  <button id="btn-download">Download</button>
</div>
<div id="gallery"></div>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const countdownEl = document.getElementById("countdown");
const flashEl = document.getElementById("flash");
const gestureLabel = document.getElementById("gesture-label");
const statusEl = document.getElementById("status");
const gallery = document.getElementById("gallery");
const btnStart = document.getElementById("btn-start");
const banner = document.getElementById("banner");
const errBox = document.getElementById("err");

const FILTER_NAMES = ["Off", "Grayscale", "Sepia", "Invert"];
const FILTER_CSS = ["none", "grayscale(1)", "sepia(1)", "invert(1)"];

let landmarker = null;
let stream = null;
let running = false;
let rafId = 0;
let blurred = false;
let filterMode = 0;
let photos = [];
let lastGesture = "";
let stable = 0;
let busy = false;
let cooldownUntil = 0;
let lastVideoTime = -1;

const inApp = /FBAN|FBAV|Instagram|Line\/|WhatsApp|Telegram|wv\)/i.test(navigator.userAgent)
  || !!window.TelegramWebviewProxy
  || !!window.TelegramWebview;
if (inApp) {
  banner.style.display = "block";
  banner.textContent = "Buka di Chrome/Safari. Kamera sering diblokir in-app Telegram.";
}

function showErr(msg) {
  errBox.style.display = "block";
  errBox.textContent = msg;
  console.error(msg);
}

function fingersUp(lm) {
  const t = [];
  // thumb: tip farther from wrist than IP
  const wrist = lm[0];
  t.push(Math.hypot(lm[4].x - wrist.x, lm[4].y - wrist.y) >
         Math.hypot(lm[3].x - wrist.x, lm[3].y - wrist.y) ? 1 : 0);
  // others: tip above pip (smaller y)
  [[8,6],[12,10],[16,14],[20,18]].forEach(([tip, pip]) => {
    t.push(lm[tip].y < lm[pip].y ? 1 : 0);
  });
  return t;
}

function classify([th, i, m, r, p]) {
  if (!i && !m && !r && !p) return "Fist";
  if (i && m && !r && !p) return "Peace"; // thumb ignored — HP noisy
  if (i && m && r && p) return "OpenPalm";
  return "Unknown";
}

function drawLandmarks(lm) {
  const w = canvas.width, h = canvas.height;
  const conn = [
    [0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],
    [5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],
    [13,17],[17,18],[18,19],[19,20],[0,17]
  ];
  ctx.strokeStyle = "rgba(255,51,102,.7)";
  ctx.lineWidth = 3;
  for (const [a, b] of conn) {
    ctx.beginPath();
    ctx.moveTo(lm[a].x * w, lm[a].y * h);
    ctx.lineTo(lm[b].x * w, lm[b].y * h);
    ctx.stroke();
  }
  ctx.fillStyle = "#ff3366";
  for (const p of lm) {
    ctx.beginPath();
    ctx.arc(p.x * w, p.y * h, 4, 0, Math.PI * 2);
    ctx.fill();
  }
}

function loop() {
  if (!running) return;
  rafId = requestAnimationFrame(loop);
  if (!landmarker || video.readyState < 2) return;
  if (video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;

  if (canvas.width !== video.videoWidth) {
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
  }

  const now = performance.now();
  const result = landmarker.detectForVideo(video, now);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  let g = "NoHand";
  const hands = result.landmarks || [];
  if (hands.length) {
    drawLandmarks(hands[0]);
    g = classify(fingersUp(hands[0]));
  }

  if (g === lastGesture) stable++;
  else { lastGesture = g; stable = 1; }

  gestureLabel.textContent = g === "NoHand" ? "tunjuk tangan" : g;

  video.style.filter = blurred ? "blur(18px)" : FILTER_CSS[filterMode];
  canvas.style.filter = blurred ? "blur(18px)" : "none";

  if (stable === 8 && !busy && now > cooldownUntil) {
    if (g === "Peace") startCountdown();
    else if (g === "Fist") toggleBlur();
    else if (g === "OpenPalm") cycleFilter();
    cooldownUntil = now + 1800;
  }
}

async function loadModel() {
  if (landmarker) return;
  statusEl.textContent = "load model…";
  const fileset = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  landmarker = await HandLandmarker.createFromOptions(fileset, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numHands: 1,
    minHandDetectionConfidence: 0.5,
    minHandPresenceConfidence: 0.5,
    minTrackingConfidence: 0.5
  });
}

async function startCam() {
  errBox.style.display = "none";
  if (!navigator.mediaDevices?.getUserMedia) {
    showErr("Browser tidak support kamera. Pakai Chrome/Safari.");
    return;
  }
  btnStart.disabled = true;
  try {
    await loadModel();
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }
    });
    video.srcObject = stream;
    video.setAttribute("playsinline", "");
    video.setAttribute("webkit-playsinline", "");
    await video.play();
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    running = true;
    lastVideoTime = -1;
    loop();
    btnStart.textContent = "Stop";
    btnStart.classList.remove("primary");
    statusEl.textContent = "● LIVE";
    statusEl.style.color = "#00ff88";
  } catch (e) {
    const name = e.name || "";
    if (name === "NotAllowedError") showErr("Izin kamera ditolak. Settings → Chrome → Kamera ON.");
    else if (name === "NotFoundError") showErr("Kamera tidak ketemu.");
    else if (name === "NotReadableError") showErr("Kamera dipakai app lain. Tutup app kamera dulu.");
    else showErr("Gagal: " + (e.message || name || e));
    stopCam();
  } finally {
    btnStart.disabled = false;
  }
}

function stopCam() {
  running = false;
  cancelAnimationFrame(rafId);
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  video.srcObject = null;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  btnStart.textContent = "Start Camera";
  btnStart.classList.add("primary");
  statusEl.textContent = "●";
  statusEl.style.color = "#fff";
  gestureLabel.textContent = "kamera off";
}

function startCountdown() {
  if (busy) return;
  busy = true;
  let n = 3;
  countdownEl.textContent = n;
  countdownEl.style.display = "flex";
  const tick = () => {
    n--;
    if (n > 0) {
      countdownEl.textContent = n;
      setTimeout(tick, 700);
    } else {
      countdownEl.style.display = "none";
      capturePhoto();
      busy = false;
    }
  };
  setTimeout(tick, 700);
}

function capturePhoto() {
  flashEl.style.opacity = "0.9";
  setTimeout(() => { flashEl.style.opacity = "0"; }, 180);
  const tmp = document.createElement("canvas");
  tmp.width = video.videoWidth || 640;
  tmp.height = video.videoHeight || 480;
  const t = tmp.getContext("2d");
  t.translate(tmp.width, 0);
  t.scale(-1, 1);
  if (filterMode && !blurred) t.filter = FILTER_CSS[filterMode];
  t.drawImage(video, 0, 0, tmp.width, tmp.height);
  const url = tmp.toDataURL("image/jpeg", 0.92);
  photos.push(url);
  const img = document.createElement("img");
  img.src = url;
  img.onclick = () => download(url);
  gallery.appendChild(img);
}

function download(url) {
  const a = document.createElement("a");
  a.href = url;
  a.download = "booth-" + Date.now() + ".jpg";
  a.click();
}

function toggleBlur() {
  blurred = !blurred;
  document.getElementById("btn-blur").textContent = blurred ? "Unblur" : "Blur";
}

function cycleFilter() {
  filterMode = (filterMode + 1) % FILTER_NAMES.length;
  document.getElementById("btn-filter").textContent = "Filter: " + FILTER_NAMES[filterMode];
}

btnStart.onclick = () => running ? stopCam() : startCam();
document.getElementById("btn-capture").onclick = startCountdown;
document.getElementById("btn-blur").onclick = toggleBlur;
document.getElementById("btn-filter").onclick = cycleFilter;
document.getElementById("btn-download").onclick = () => {
  if (!photos.length) { showErr("Belum ada foto."); return; }
  photos.forEach((u, i) => setTimeout(() => download(u), i * 250));
};
</script>
</body>
</html>
